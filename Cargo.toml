[package]
name = "wolfbeat"
version = "1.0.0"
edition = "2021"
description = "Wolfbeat - a fast desktop music player for Windows, written in Rust"
license = "MIT"
build = "build.rs"

[[bin]]
name = "Wolfbeat"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
lofty = "0.21"
rfd = "0.15"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rand = "0.8"
wry = "0.46"
ureq = { version = "2", features = ["json"] }
webview2-com = "0.33"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[profile.release]
opt-level = 3
lto = "thin"

# Keep audio decoding and image scaling fast even in debug builds.
[profile.dev.package."*"]
opt-level = 2
